openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: services
    description: Service catalogue
  - name: parts
    description: Spare parts catalogue
  - name: bookings
    description: Online service bookings
  - name: contact
    description: Contact enquiries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List service offerings
      responses:
        "200":
          description: Service offerings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /parts:
    get:
      operationId: listParts
      tags: [parts]
      summary: Search spare parts
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: brand
          schema:
            type: string
        - in: query
          name: vehicleType
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          description: Matching spare parts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Part"
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a service booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid booking
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings for future admin use
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Account created, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: Login successful, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
  /auth/logout:
    post: { operationId: logout, tags: [auth], responses: { "200": { description: Logged out } } }
  /auth/refresh:
    post: { operationId: refresh, tags: [auth], responses: { "200": { description: Session refreshed } } }
  /auth/forgot-password:
    post: { operationId: forgotPassword, tags: [auth], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } } }, responses: { "200": { description: Recovery requested } } }
  /auth/reset-password:
    post: { operationId: resetPassword, tags: [auth], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 8 } } } } } }, responses: { "200": { description: Password reset } } }
  /account/profile:
    get: { operationId: getProfile, tags: [account], responses: { "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } } } }
    put: { operationId: updateProfile, tags: [account], requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileRequest" } } } }, responses: { "200": { description: Updated } } }
  /account/vehicles:
    get: { operationId: listVehicles, tags: [vehicles], responses: { "200": { description: Vehicles, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Vehicle" } } } } } } }
    post: { operationId: createVehicle, tags: [vehicles], requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleRequest" } } } }, responses: { "201": { description: Created } } }
  /vehicle-brands:
    get: { operationId: listVehicleBrands, tags: [vehicles], responses: { "200": { description: Brands } } }
  /vehicle-models:
    get: { operationId: listVehicleModels, tags: [vehicles], parameters: [{ in: query, name: brandId, schema: { type: integer } }], responses: { "200": { description: Models } } }
  /mechanics:
    get: { operationId: listMechanics, tags: [mechanics], responses: { "200": { description: Available mechanics } } }
  /cart:
    get: { operationId: getCart, tags: [cart], responses: { "200": { description: Cart } } }
  /cart/items:
    post: { operationId: addCartItem, tags: [cart], requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CartItemRequest" } } } }, responses: { "201": { description: Added } } }
  /orders:
    post: { operationId: createOrder, tags: [orders], requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderRequest" } } } }, responses: { "201": { description: Created } } }
  /account/orders:
    get: { operationId: listOrders, tags: [orders], responses: { "200": { description: Orders } } }
  /account/bookings:
    get: { operationId: listAccountBookings, tags: [bookings], responses: { "200": { description: Bookings } } }
  /account/notifications:
    get: { operationId: listNotifications, tags: [notifications], responses: { "200": { description: Notifications } } }
  /wholesale/quotes:
    post: { operationId: createWholesaleQuote, tags: [wholesale], requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WholesaleQuoteRequest" } } } }, responses: { "201": { description: Created } } }
  /parts/categories:
    get: { operationId: listPartCategories, tags: [parts], responses: { "200": { description: Categories } } }
  /parts/compatible/{vehicleId}:
    get: { operationId: listCompatibleParts, tags: [parts], parameters: [{ in: path, name: vehicleId, required: true, schema: { type: integer } }], responses: { "200": { description: Compatible parts } } }
  /contact:
    post:
      operationId: createContactInquiry
      tags: [contact]
      summary: Send a contact enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactInquiry"
        "400":
          description: Invalid enquiry
components:
  schemas:
    RegisterRequest:
      type: object
      required: [name, phone, email, password]
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string, minLength: 10 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string }
        password: { type: string }
    AuthResponse:
      type: object
      properties: { success: { type: boolean }, data: { type: object } }
    User:
      type: object
      properties: { id: { type: integer }, name: { type: string }, phone: { type: string }, email: { type: string }, role: { type: string } }
    ProfileRequest:
      type: object
      required: [name, phone, email]
      properties: { name: { type: string }, phone: { type: string }, email: { type: string, format: email } }
    VehicleRequest:
      type: object
      required: [brand, model, vehicleType, registrationNumber]
      properties: { brand: { type: string }, model: { type: string }, vehicleType: { type: string }, registrationNumber: { type: string }, vehicleAge: { type: integer } }
    Vehicle:
      allOf:
        - $ref: "#/components/schemas/VehicleRequest"
        - type: object
          properties: { id: { type: integer } }
    CartItemRequest:
      type: object
      required: [productId, quantity]
      properties: { productId: { type: integer }, quantity: { type: integer, minimum: 1 } }
    OrderRequest:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CartItemRequest" } }
        deliveryMethod: { type: string, enum: [PICKUP, DELIVERY] }
        paymentMethod: { type: string, enum: [CASH, COD, ONLINE] }
    WholesaleQuoteRequest:
      type: object
      required: [name, phone, requiredProducts]
      properties: { name: { type: string }, phone: { type: string }, businessName: { type: string }, requiredProducts: { type: array, items: { type: object } }, message: { type: string } }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Service:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        estimatedDuration: { type: string }
        startingPrice: { type: string }
        icon: { type: string }
      required: [id, name, description, estimatedDuration, startingPrice, icon]
    Part:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        brand: { type: string }
        vehicleTypes:
          type: array
          items: { type: string }
        description: { type: string }
        availability: { type: string }
      required: [id, name, category, brand, vehicleTypes, description, availability]
    BookingInput:
      type: object
      properties:
        fullName: { type: string, minLength: 2 }
        phone: { type: string, minLength: 10 }
        email: { type: string }
        vehicleBrand: { type: string, minLength: 1 }
        vehicleModel: { type: string, minLength: 1 }
        vehicleType: { type: string, minLength: 1 }
        registrationNumber: { type: string, minLength: 1 }
        vehicleAge: { type: string }
        selectedServices:
          type: array
          minItems: 1
          items: { type: string }
        appointmentDate: { type: string, minLength: 1 }
        timeSlot: { type: string, minLength: 1 }
        problemDescription: { type: string }
      required:
        - fullName
        - phone
        - email
        - vehicleBrand
        - vehicleModel
        - vehicleType
        - registrationNumber
        - vehicleAge
        - selectedServices
        - appointmentDate
        - timeSlot
        - problemDescription
    Booking:
      allOf:
        - $ref: "#/components/schemas/BookingInput"
        - type: object
          properties:
            id: { type: string }
            bookingId: { type: string }
            status: { type: string }
            createdAt: { type: string }
          required: [id, bookingId, status, createdAt]
    ContactInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string, minLength: 10 }
        subject: { type: string, minLength: 2 }
        message: { type: string, minLength: 5 }
      required: [name, phone, subject, message]
    ContactInquiry:
      allOf:
        - $ref: "#/components/schemas/ContactInput"
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string }
          required: [id, createdAt]

